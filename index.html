<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Link preview (thumbnail) for Messenger / Facebook -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="BOX OF MEAT">
<meta property="og:title" content="BOX OF MEAT — Today's Prices">
<meta property="og:description" content="Tap to view today's on-hand Beef, Chicken and Pork prices. Wholesale meatshop, General Trias City, Cavite.">
<meta property="og:url" content="https://boxofmeatph.github.io/">
<meta property="og:image" content="https://boxofmeatph.github.io/card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="BOX OF MEAT — Today's Prices, tap to view">
<meta name="twitter:card" content="summary_large_image">

<style>
  :root { color-scheme: light; }
  body { margin: 0; background: #f4f4f4; font-family: Arial, Helvetica, sans-serif; color: #1f1f1f; }
  main { max-width: 820px; margin: 0 auto; padding: 16px; text-align: center; }
  #prices { width: 100%; height: auto; display: block; background: #fff;
            border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
  #loading { padding: 60px 16px; color: #8E1B1B; font-weight: bold; }
  .note { font-size: 13px; color: #6b6b6b; margin: 14px 0 6px; }
  a.btn { display: inline-block; margin-top: 8px; padding: 12px 24px; border-radius: 999px;
          background: #C62828; color: #fff; font-weight: bold; text-decoration: none; }
</style>
</head>
<body>
<main>
  <div id="loading">Loading today's prices…</div>
  <img id="prices" alt="BOX OF MEAT — today's on-hand prices" hidden>
  <p class="note">This list updates automatically. Message us on our page to order.</p>
  <a class="btn" id="dl" href="#">Save image</a>
</main>
<script>
  // Always fetch a fresh copy of the live price slide (no stale cache).
  var src = "https://docs.google.com/presentation/d/1WV6oIuM0tg36-CHSVcT2rGdHyet_cZyQx6FD8rH4QQQ/export/png?pageid=p&t=" + Date.now();
  var img = document.getElementById("prices");
  img.onload = function () { document.getElementById("loading").hidden = true; img.hidden = false; };
  img.onerror = function () { document.getElementById("loading").textContent = "Couldn't load the price list. Please refresh the page."; };
  img.src = src;
  document.getElementById("dl").href = src;
</script>
</body>
</html>
